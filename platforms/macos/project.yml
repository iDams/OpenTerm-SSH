name: OpenTerm

options:
  bundleIdPrefix: com.openterm
  deploymentTarget:
    macOS: "14.0"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.11.2

targets:
  OpenTerm:
    type: application
    platform: macOS
    info:
      path: Info.plist
    sources:
      - path: Sources
    dependencies:
      - framework: ../../dist/OpenTermCore.xcframework
        embed: false
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openterm.mac
        PRODUCT_NAME: OpenTerm
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: 14.0
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenTerm.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../dist
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../vendor/apple/openssl/3.6.1/macos-arm64/lib
          - $(SRCROOT)/../../vendor/apple/libssh/0.11.3/macos-arm64/lib
        OTHER_LDFLAGS:
          - $(inherited)
          - -lz
          - -lcrypto
          - -lssl
          - -lssh
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O
    entitlements:
      path: OpenTerm.entitlements
